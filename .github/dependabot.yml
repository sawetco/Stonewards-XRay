version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      routine-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
